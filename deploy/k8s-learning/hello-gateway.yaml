apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hello-gateway
spec:
  # 该草稿依赖名为 nginx 的 GatewayClass；本学习会话没有形成集群验收证据。
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-yaml-route
spec:
  # HTTPRoute 只选择 Service；实际入口由上面的 Gateway 和对应控制器提供。
  parentRefs:
    - name: hello-gateway
  rules:
    - backendRefs:
        - name: hello-yaml-service
          port: 80
